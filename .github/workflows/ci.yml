name: CI

on:
  pull_request:
  push:
    branches: [main]

# CI verifies the repository and that the release candidate is reproducible.
# It holds no credentials and never publishes, tags, commits, or pushes;
# staging on npm belongs to release.yml.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Superseded PR checks may stop. A main run must finish, because release.yml
  # requires a successful CI run for the exact commit it stages.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    env:
      RUSTUP_TOOLCHAIN: 1.96.0
      # The whole-workspace build outgrows a hosted runner's disk with full
      # debuginfo; line tables keep backtraces readable.
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Free runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable
        with:
          toolchain: 1.96.0
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown, wasm32-wasip1

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # v2.88.1
        with:
          tool: just,wasm-tools@1.261.0

      - name: Install frozen dependency graph
        run: pnpm install --frozen-lockfile

      - name: Pull request gate
        if: github.event_name == 'pull_request'
        run: just gate

      - name: Main acceptance
        if: github.event_name == 'push'
        run: just ci

      - name: Release candidate is reproducible and installs with its Zod peers
        run: |
          node scripts/release/create-candidate.mjs --output "$RUNNER_TEMP/candidate-a"
          node scripts/release/create-candidate.mjs --output release-candidate
          node scripts/release/compare-candidates.mjs "$RUNNER_TEMP/candidate-a" release-candidate
          node scripts/build/zod-peer-smoke.mjs --candidate release-candidate --zod 4.6.5
          node scripts/build/zod-peer-smoke.mjs --candidate release-candidate --zod '^4.6.5'

  pure-msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable
        with:
          toolchain: 1.88.0
          components: clippy

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # v2.88.1
        with:
          tool: just

      - name: Verify pure library minimum Rust version
        run: just rust-msrv

  latest-rust:
    env:
      RUSTUP_TOOLCHAIN: 1.99.1
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable
        with:
          toolchain: 1.99.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo check --workspace --all-targets --all-features --locked

  minimum-node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.21.0
          cache: pnpm
      - uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # v2.88.1
        with:
          tool: just
      - run: pnpm install --frozen-lockfile
      - run: just pack-smoke
